<div class="navbar bg-base-100 border-b border-base-300 sticky top-0 z-10 shadow-sm">
  <div class="navbar-start">
    <a routerLink="/" class="btn btn-ghost text-xl text-primary font-bold">Full-Stack Blog</a>
  </div>
  <div class="navbar-end gap-2">
    <a routerLink="/" class="btn btn-ghost btn-sm">Home</a>
    @if (authService.isLoggedIn()) {
      <a routerLink="/admin" class="btn btn-primary btn-sm">Dashboard</a>
      <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Logout</button>
    } @else {
      <a routerLink="/login" class="btn btn-outline btn-primary btn-sm">Admin Login</a>
    }
  </div>
</div>

<main class="min-h-screen bg-base-200">
  <router-outlet />
</main>

<footer class="footer footer-center bg-neutral text-neutral-content p-4 text-sm">
  <p>Angular frontend &middot; .NET 10 Web API backend &middot; daisyUI emerald theme</p>
</footer>
