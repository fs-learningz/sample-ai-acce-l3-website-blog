<div class="drawer lg:drawer-open">
  <input id="admin-sidebar" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content">
    <div class="navbar bg-base-100 border-b border-base-300 lg:hidden">
      <label for="admin-sidebar" class="btn btn-ghost btn-sm drawer-button">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </label>
      <span class="font-bold text-primary ml-2">Admin Dashboard</span>
    </div>
    <div class="p-6">
      <router-outlet />
    </div>
  </div>

  <div class="drawer-side">
    <label for="admin-sidebar" aria-label="close sidebar" class="drawer-overlay"></label>
    <aside class="bg-neutral text-neutral-content w-64 min-h-full p-4 flex flex-col">
      <div class="mb-6 px-2">
        <h2 class="text-lg font-bold">Admin Dashboard</h2>
        <p class="text-neutral-content/60 text-sm">
          Signed in as {{ authService.currentUser()?.name }} ({{ authService.currentUser()?.role }})
        </p>
      </div>

      <ul class="menu w-full gap-1">
        <li>
          <a routerLink="/admin/posts" routerLinkActive="active">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z" />
            </svg>
            {{ authService.isAdmin() ? 'All Posts' : 'My Posts' }}
          </a>
        </li>
        <li>
          <a routerLink="/admin/editor" routerLinkActive="active">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Editor
          </a>
        </li>
        @if (authService.isAdmin()) {
          <li>
            <a routerLink="/admin/users" routerLinkActive="active">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4zm6 0a4 4 0 10-4-4" />
              </svg>
              Users
            </a>
          </li>
        }
      </ul>

      <div class="mt-auto">
        <button type="button" class="btn btn-ghost btn-sm w-full justify-start text-neutral-content" (click)="logout()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Logout
        </button>
      </div>
    </aside>
  </div>
</div>
