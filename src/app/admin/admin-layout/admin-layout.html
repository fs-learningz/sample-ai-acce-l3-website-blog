<div class="drawer lg:drawer-open">
  <input id="admin-drawer" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content flex min-h-screen flex-col">
    <header class="navbar bg-base-100 shadow-sm sticky top-0 z-10">
      <div class="flex flex-1 items-center gap-1">
        <label for="admin-drawer" class="btn btn-ghost btn-square lg:hidden" aria-label="Open sidebar">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </label>
        <span class="font-bold text-primary">Emerald Blog · Admin</span>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Logout</button>
    </header>
    <main class="flex-1">
      <router-outlet />
    </main>
  </div>

  <div class="drawer-side z-30">
    <label for="admin-drawer" aria-label="Close sidebar" class="drawer-overlay"></label>
    <aside class="flex min-h-full w-64 flex-col bg-base-200">
      <div class="border-b border-base-300 p-4">
        <div class="text-lg font-bold text-primary">Emerald Blog</div>
        <div class="text-xs text-base-content/60">Admin workspace</div>
      </div>

      <nav class="menu w-full flex-1 gap-1 p-2">
        <li>
          <a routerLink="/admin" routerLinkActive="menu-active" [routerLinkActiveOptions]="{ exact: true }">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            My Posts
          </a>
        </li>
        <li>
          <a routerLink="/admin/editor" routerLinkActive="menu-active">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487 18.549 2.8a1.875 1.875 0 1 1 2.652 2.652L10.582 16.076a9 9 0 0 1-3.242 2.038l-.808.271a.75.75 0 0 1-.93-.93l.271-.808a9 9 0 0 1 2.038-3.242L16.862 4.487Zm0 0L19.5 7.125" />
            </svg>
            Editor
          </a>
        </li>
      </nav>

      <div class="border-t border-base-300 p-4 text-xs text-base-content/50">
        Signed in as admin
      </div>
    </aside>
  </div>
</div>
